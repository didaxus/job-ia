name: JobPilot validation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    env:
      JOBPILOT_DB_PASSWORD: ci-not-a-production-password

    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install offline test requirements
        run: python -m pip install 'httpx>=0.27' 'pyyaml>=6.0'
      - name: Run policy and repository layout tests
        run: python -m unittest discover -s tests -v
      - name: Validate Docker Compose syntax
        run: docker compose -f compose.yaml config --quiet
      - name: Assert no personal files committed
        run: |
          ! git ls-files | grep -E '^(\.env$|private/(facts|profile)\.yaml$|data/[^.]+|applications/[^.]+)'
  postgres-integration:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: jobpilot
          POSTGRES_USER: jobpilot
          POSTGRES_PASSWORD: test-only-ci-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U jobpilot -d jobpilot"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=15
    env:
      JOBPILOT_TEST_POSTGRES: '1'
      PGPASSWORD: test-only-ci-password
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGUSER: jobpilot
      PGDATABASE: jobpilot
      JOBPILOT_SCHEMA: db/schema.sql
      LEGACY_SQLITE_PATH: /tmp/jobpilot-no-such.sqlite
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: python -m pip install 'httpx>=0.27' 'pyyaml>=6.0' 'psycopg[binary]>=3.2,<4'
      - name: Check PostgreSQL migration and SQLite backfill
        run: python -m unittest discover -s tests -p test_pg_integration.py -v
  image-build:
    runs-on: ubuntu-24.04
    env:
      JOBPILOT_DB_PASSWORD: ci-not-a-production-password
    needs: checks
    steps:
      - uses: actions/checkout@v4
      - name: Build both images (no deploy or submissions)
        run: docker compose -f compose.yaml build pipeline dashboard
