services:
  pipeline:
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        SEARCH_REF: 1a09901abfd47ee168515be97399ea8294caa7c2
        JOBHUNT_REF: 0dba3f600011fe7870702db276db536f283dc0e0
    environment:
      TZ: America/Bogota
      JOBPILOT_PRIVATE_DIR: /opt/jobpilot/private
      JOBPILOT_CONFIG_DIR: /opt/jobpilot/config
      JOBPILOT_OUTPUT_DIR: /output
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      FIT_MIN: ${FIT_MIN:-80}
      MAX_AI_EVALUATIONS: ${MAX_AI_EVALUATIONS:-20}
      SCAN_EVERY_HOURS: ${SCAN_EVERY_HOURS:-24}
      AUTO_EMAIL: ${AUTO_EMAIL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ${JOBPILOT_PRIVATE_HOST_DIR:-/srv/jobpilot-id/private}:/opt/jobpilot/private:ro
      - jobpilot_db:/opt/job_search_tool/data
      - jobpilot_applications:/output
    command: ["python", "/opt/jobpilot/app/jobpilot.py", "--loop"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        SEARCH_REF: 1a09901abfd47ee168515be97399ea8294caa7c2
    environment:
      NODE_ENV: production
      DB_PATH: /opt/job_search_tool/data/seen_jobs.sqlite3
    volumes:
      - jobpilot_db:/opt/job_search_tool/data
    ports:
      - "127.0.0.1:13030:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

volumes:
  jobpilot_db:
  jobpilot_applications:
