services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobpilot
      POSTGRES_USER: jobpilot
      POSTGRES_PASSWORD: ${JOBPILOT_DB_PASSWORD:?Set a strong JOBPILOT_DB_PASSWORD in Coolify}
      TZ: America/Bogota
    volumes:
      - jobpilot_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobpilot -d jobpilot"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

  pipeline:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.worker
      args:
        SEARCH_REF: 1a09901abfd47ee168515be97399ea8294caa7c2
        JOBHUNT_REF: 0dba3f600011fe7870702db276db536f283dc0e0
    environment:
      TZ: America/Bogota
      JOBPILOT_PRIVATE_DIR: /opt/jobpilot/private
      JOBPILOT_CONFIG_DIR: /opt/jobpilot/config
      JOBPILOT_OUTPUT_DIR: /output
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: jobpilot
      PGDATABASE: jobpilot
      PGPASSWORD: ${JOBPILOT_DB_PASSWORD:?Set JOBPILOT_DB_PASSWORD in Coolify}
      LEGACY_SQLITE_PATH: /opt/job_search_tool/data/seen_jobs.sqlite3
      CODEX_HOME: /opt/jobpilot-codex-home
      FIT_MIN: ${FIT_MIN:-80}
      MAX_CODEX_EVALUATIONS_PER_DAY: ${MAX_CODEX_EVALUATIONS_PER_DAY:-4}
      SCAN_EVERY_HOURS: ${SCAN_EVERY_HOURS:-24}
      AUTO_EMAIL: ${AUTO_EMAIL:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
    volumes:
      - ${JOBPILOT_PRIVATE_HOST_DIR:-/srv/jobpilot-id/private}:/opt/jobpilot/private:ro
      - jobpilot_db:/opt/job_search_tool/data
      - jobpilot_applications:/output
      # Writable only for Codex CLI token refresh; never mounted in dashboard.
      - ${JOBPILOT_CODEX_HOST_DIR:-/srv/jobpilot-id/codex-home}:/opt/jobpilot-codex-home
    command: ["python", "/opt/jobpilot/app/profile_worker.py"]
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  dashboard:
    depends_on:
      postgres:
        condition: service_healthy
    build:
      context: .
      dockerfile: Dockerfile.dashboard
      args:
        SEARCH_REF: 1a09901abfd47ee168515be97399ea8294caa7c2
    environment:
      NODE_ENV: production
      DB_PATH: /opt/job_search_tool/data/seen_jobs.sqlite3
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: jobpilot
      PGDATABASE: jobpilot
      PGPASSWORD: ${JOBPILOT_DB_PASSWORD:?Set JOBPILOT_DB_PASSWORD in Coolify}
      JOBPILOT_PRIVATE_DIR: /opt/jobpilot/private
    volumes:
      - jobpilot_db:/opt/job_search_tool/data:ro
      - ${JOBPILOT_PRIVATE_HOST_DIR:-/srv/jobpilot-id/private}:/opt/jobpilot/private
    # Cloudflare Tunnel -> Traefik (HTTPS entrypoint) -> Next.js dashboard:3000.
    # Do not expose personal data until Cloudflare Access protects this hostname.
    networks:
      - default
      - coolify
    labels:
      - 'traefik.enable=true'
      - 'traefik.docker.network=coolify'
      - 'traefik.http.routers.job-ia-dashboard.rule=Host(`jobs-ia.didaxus.com`)'
      - 'traefik.http.routers.job-ia-dashboard.entrypoints=https'
      - 'traefik.http.routers.job-ia-dashboard.tls=true'
      - 'traefik.http.routers.job-ia-dashboard.priority=10'
      - 'traefik.http.routers.job-ia-dashboard.service=job-ia-dashboard'
      - 'traefik.http.routers.job-ia-dashboard.middlewares=job-ia-dashboard-headers,job-ia-dashboard-rate-limit'
      - 'traefik.http.services.job-ia-dashboard.loadbalancer.server.port=3000'
      - 'traefik.http.services.job-ia-dashboard.loadbalancer.server.scheme=http'
      - 'traefik.http.services.job-ia-dashboard.loadbalancer.passhostheader=true'
      - 'traefik.http.middlewares.job-ia-dashboard-headers.headers.stsSeconds=31536000'
      - 'traefik.http.middlewares.job-ia-dashboard-headers.headers.stsIncludeSubdomains=true'
      - 'traefik.http.middlewares.job-ia-dashboard-headers.headers.stsPreload=true'
      - 'traefik.http.middlewares.job-ia-dashboard-headers.headers.contentTypeNosniff=true'
      - 'traefik.http.middlewares.job-ia-dashboard-headers.headers.frameDeny=true'
      - 'traefik.http.middlewares.job-ia-dashboard-headers.headers.referrerPolicy=no-referrer'
      - 'traefik.http.middlewares.job-ia-dashboard-headers.headers.permissionsPolicy=camera=(),microphone=(),geolocation=()'
      - 'traefik.http.middlewares.job-ia-dashboard-headers.headers.customResponseHeaders.X-Robots-Tag=noindex,nofollow,noarchive'
      - 'traefik.http.middlewares.job-ia-dashboard-rate-limit.ratelimit.average=120'
      - 'traefik.http.middlewares.job-ia-dashboard-rate-limit.ratelimit.burst=40'
    ports:
      - "127.0.0.1:13030:3000"
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

# The Coolify proxy already owns the external network `coolify`.
networks:
  default: {}
  coolify:
    external: true

volumes:
  jobpilot_db:
  jobpilot_applications:
  jobpilot_postgres:
